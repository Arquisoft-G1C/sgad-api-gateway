server.port=8080
spring.application.name=api-gateway

# ===============================
# === LOGGING ===
# ===============================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG


# ===============================
# === Service URLs (from environment variables) ===
# ===============================
# These will be overridden by Docker environment variables
AUTH_SERVICE_URL=${AUTH_SERVICE_URL:http://localhost:3001}
MATCH_SERVICE_URL=${MATCH_SERVICE_URL:http://localhost:8001}
REFEREE_SERVICE_URL=${REFEREE_SERVICE_URL:http://localhost:3004}
AVAILABILITY_SERVICE_URL=${AVAILABILITY_SERVICE_URL:http://localhost:8000}


